apiVersion: batch/v1
kind: Job
metadata:
  name: sample-job-ttl
spec:
  ttlSecondsAfterFinished: 20
  completions: 1
  parallelism: 1
  backoffLimit: 10
  template:
    spec:
      containers:
        - name: sample-container
          image: amsy810/tools:v2.0
          command: ["sleep"]
          args: ["20"]
      restartPolicy: Never
